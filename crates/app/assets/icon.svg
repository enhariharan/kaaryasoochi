<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>

  <!-- Row 1: completed task — filled bullet with check + full bar -->
  <circle cx="140" cy="165" r="26" fill="white"/>
  <polyline points="128,165 140,177 158,151"
            fill="none" stroke="#4338CA" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="186" y="153" width="188" height="24" rx="12" fill="white"/>

  <!-- Row 2: pending task — outlined bullet + full bar -->
  <circle cx="140" cy="256" r="26" fill="none" stroke="white" stroke-width="7"/>
  <rect x="186" y="244" width="188" height="24" rx="12" fill="white"/>

  <!-- Row 3: in-progress task — outlined bullet + partial bar, slightly faded -->
  <circle cx="140" cy="347" r="26" fill="none" stroke="white" stroke-width="7" opacity="0.7"/>
  <rect x="186" y="335" width="108" height="24" rx="12" fill="white" opacity="0.7"/>

  <!-- Clock badge, bottom-right — signals scheduler, not just a task list -->
  <circle cx="396" cy="396" r="68" fill="#5B21B6"/>
  <circle cx="396" cy="396" r="68" fill="none" stroke="white" stroke-width="10"/>
  <!-- Tick marks at 12 and 3 -->
  <line x1="396" y1="336" x2="396" y2="350" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <line x1="456" y1="396" x2="442" y2="396" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- Hour hand: ~10 o'clock -->
  <line x1="396" y1="396" x2="360" y2="375" stroke="white" stroke-width="11" stroke-linecap="round"/>
  <!-- Minute hand: ~2 o'clock (classic 10:10 watchface) -->
  <line x1="396" y1="396" x2="443" y2="369" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="396" cy="396" r="7" fill="white"/>
</svg>
