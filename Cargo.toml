[workspace]
resolver = "2"
members = ["crates/core", "crates/db", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
kaaryasoochi-core = { path = "crates/core" }
kaaryasoochi-db = { path = "crates/db" }
