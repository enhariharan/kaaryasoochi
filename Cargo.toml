[workspace]
resolver = "2"
members = ["crates/core", "crates/db", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde", "wasmbind"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
kaaryasoochi-core = { path = "crates/core" }
kaaryasoochi-db = { path = "crates/db" }

# Lighter release builds: no LTO and no debuginfo keep peak RAM and link time low.
# Trade-off: slightly larger/slower binaries than `lto = "thin"`.
[profile.release]
opt-level = 2
lto = false
codegen-units = 16
debug = false
strip = "symbols"
