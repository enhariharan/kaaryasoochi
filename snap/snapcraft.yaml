name: kaaryasoochi
base: core24
version: '0.1.0'
title: Kaaryasoochi
summary: Schedule and manage cron-style jobs
description: |
  Kaaryasoochi schedules commands and scripts the way cron does, with a web
  UI to create jobs, pick schedules and read each run's output.

  - One-shot, interval and full crontab schedules, with a live preview
  - Run history with exit codes and output; a notification when a job fails
  - Retries, timeouts and per-job time zones
  - Jobs missed while the computer was off run once when it is back
  - English, Tamil, Malayalam, Telugu, Hindi, Sanskrit and Urdu

  Jobs are run by a per-user server, a systemd user service that runs as
  you, never as root. Opening Kaaryasoochi installs and starts it
  (~/.config/systemd/user/kaaryasoochi-server.service) and opens the UI in
  your browser at http://127.0.0.1:8080. It keeps running jobs after the
  browser is closed. To run jobs at boot without logging in:
  sudo loginctl enable-linger $USER

  Operator tool (list accounts, reset a password): kaaryasoochi.admin
license: MIT
contact: https://github.com/enhariharan/kaaryasoochi/issues
issues: https://github.com/enhariharan/kaaryasoochi/issues
source-code: https://github.com/enhariharan/kaaryasoochi
website: https://github.com/enhariharan/kaaryasoochi
icon: snap/gui/kaaryasoochi.png

# The server runs the user's own commands and scripts on the host, with the host's tools, which
# strict confinement cannot allow. Classic needs Snap Store approval (docs/deploy).
confinement: classic
grade: stable

platforms:
  amd64:
  arm64:

apps:
  kaaryasoochi:
    command: usr/bin/kaaryasoochi
    environment:
      # The launcher writes a systemd user unit whose ExecStart is this command.
      KAARYASOOCHI_SERVER_EXEC: /snap/bin/kaaryasoochi.server

  # Run by that user unit, as the user. Not a snap daemon: those are system services run as root.
  server:
    command: usr/bin/kaaryasoochi-server

  admin:
    command: usr/bin/kaaryasoochi-admin

parts:
  kaaryasoochi:
    plugin: nil
    # Build what is committed: a plain `source: .` would also copy target/ (tens of GB).
    source: .
    source-type: git
    build-attributes:
      # Point the binaries at core24's loader and libraries, not the host's.
      - enable-patchelf
    build-packages:
      # Versioned Ubuntu toolchain; 1.97 is the one with a packaged wasm32 standard library.
      - cargo-1.97
      - rustc-1.97
      - libstd-rust-1.97-dev-wasm32
      - lld
      - pkgconf
      - libssl-dev
      - zlib1g-dev
      - ca-certificates
    override-build: |
      export PATH="/usr/lib/rust-1.97/bin:$PATH"
      # The browser UI: the WebKitGTK window cannot be bundled in a classic snap (its helper
      # processes are looked up at the host's paths), and the server serves the UI itself.
      packaging/build.sh --web
      packaging/install.sh "$CRAFT_PART_INSTALL" /usr
    # The launcher entry is snap/gui/kaaryasoochi.desktop.
    prime:
      - usr/bin
      - usr/lib/kaaryasoochi
      - usr/lib/systemd/user
      - usr/share/metainfo
