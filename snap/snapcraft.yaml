name: kaaryasoochi
base: core24
version: '0.1.0'
summary: Schedule and manage cron-style jobs
description: |
  Kaaryasoochi is a cron-style job scheduler with a WebKitGTK desktop UI
  and a built-in server backend. Create jobs, set cron-style recurrence
  schedules, view run history, and manage jobs across timezones.

  Features:
  - Cron-style and one-shot job scheduling
  - Full run history with status tracking
  - Per-job timezone support
  - i18n: English, Tamil, Malayalam, Telugu, Hindi, Sanskrit, Urdu

  Jobs are run by a per-user server, a systemd user service that runs as
  you (never as root). Opening the app installs and starts it:
  ~/.config/systemd/user/kaaryasoochi-server.service.

# The server runs the user's own commands and scripts on the host, which strict confinement
# cannot allow. Classic needs Snap Store approval before it can be released.
confinement: classic
grade: devel

apps:
  kaaryasoochi:
    command: usr/bin/kaaryasoochi
    environment:
      # The launcher writes a systemd user unit whose ExecStart is this command.
      KAARYASOOCHI_SERVER_EXEC: /snap/bin/kaaryasoochi.server

  # Run by the user unit, as the user. Not a snap daemon: those are system services run as root.
  server:
    command: usr/bin/kaaryasoochi-server

parts:
  app:
    plugin: rust
    source: .
    build-packages:
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libssl-dev
      - pkg-config
      - curl
      - libsoup-3.0-dev
      - libjavascriptcoregtk-4.1-dev
      - libxdo-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - libssl3
      - ca-certificates
      - libxdo3
    override-build: |
      set -eu

      # Ensure cargo bin is on PATH (plugin: rust sets up Rust but not ~/.cargo/bin)
      export PATH="$HOME/.cargo/bin:$PATH"

      # Install dioxus-cli at the pinned version
      cargo install dioxus-cli --version 0.7.9 --locked

      # Build from crates/app where Dioxus.toml lives
      cd "$SNAPCRAFT_PART_BUILD/crates/app"
      KAARYASOOCHI_SERVER_URL=http://127.0.0.1:8080 \
        dx build --desktop --release

      BUILD="$SNAPCRAFT_PART_BUILD/target/dx/kaaryasoochi-app/release"

      # Desktop app: binary + hashed assets must stay together
      mkdir -p "$SNAPCRAFT_PART_INSTALL/usr/lib/kaaryasoochi/app"
      cp -r "$BUILD/linux/app/." \
            "$SNAPCRAFT_PART_INSTALL/usr/lib/kaaryasoochi/app/"

      # Server: binary + web public (server cds here to serve static files)
      mkdir -p "$SNAPCRAFT_PART_INSTALL/usr/lib/kaaryasoochi/web"
      cp "$BUILD/web/server" \
         "$SNAPCRAFT_PART_INSTALL/usr/lib/kaaryasoochi/web/server"
      cp -r "$BUILD/web/public" \
            "$SNAPCRAFT_PART_INSTALL/usr/lib/kaaryasoochi/web/public"

      # Launcher, server wrapper and the systemd user unit the launcher installs
      COMMON="$SNAPCRAFT_PART_BUILD/packaging/common"
      install -Dm755 "$COMMON/kaaryasoochi" "$SNAPCRAFT_PART_INSTALL/usr/bin/kaaryasoochi"
      install -Dm755 "$COMMON/kaaryasoochi-server" \
                     "$SNAPCRAFT_PART_INSTALL/usr/bin/kaaryasoochi-server"
      install -Dm644 "$COMMON/kaaryasoochi-server.service" \
                     "$SNAPCRAFT_PART_INSTALL/usr/lib/systemd/user/kaaryasoochi-server.service"
